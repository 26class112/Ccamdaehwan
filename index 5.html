<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>김대환의 필리핀 농장</title>

<style>

html,body{height:auto}body{margin:0 auto;max-width:440px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;padding:8px}
#top{display:flex;justify-content:space-between;align-items:center;font-size:17px}

</style></head><body>
<div id="top"><b>🥭 김대환의 필리핀 농장</b><button id="snd">🔊</button></div>

ant:r=>{r(0,5,3,6,'#555');r(2,7,9,6,'#8d8d8d');r(3,7,8,1,'#222');r(11,8,5,2,'#6d6d6d');r(11,7,1,1,'#111');r(3,13,2,3,'#555');r(8,13,2,3,'#555')},

cat:r=>{r(1,5,2,6,'#e8923a');r(3,8,9,5,'#e8923a');r(5,8,1,3,'#b8661c');r(8,8,1,3,'#b8661c');r(9,4,5,5,'#e8923a');r(9,2,1,2,'#e8923a');r(13,2,1,2,'#e8923a');r(10,6,1,1,'#111');r(12,6,1,1,'#111');r(4,13,2,3,'#c8761f');r(9,13,2,3,'#c8761f')},
honey:r=>{r(5,1,6,7,'#f5b5c8');r(6,0,4,1,'#fff');r(7,3,1,1,'#222');r(9,3,1,1,'#222');r(7,5,2,1,'#c55');r(3,7,10,8,'#e0a030');r(3,6,10,1,'#8a5a1a');r(4,8,2,5,'#f7c860');r(2,9,1,2,'#e0a030');r(13,9,1,2,'#e0a030')},
cher:r=>{r(8,0,3,2,'#3fa04b');r(5,2,1,6,'#2e7d32');r(11,2,1,6,'#2e7d32');r(5,2,7,1,'#2e7d32');r(2,8,6,6,'#d6203a');r(9,8,6,6,'#d6203a');r(3,9,1,1,'#fff');r(10,9,1,1,'#fff');r(4,11,1,1,'#111');r(6,11,1,1,'#111');r(11,11,1,1,'#111');r(13,11,1,1,'#111')},
blue:r=>{r(4,4,8,1,'#3b4fa8');r(3,5,10,9,'#3b4fa8');r(6,3,4,2,'#2a8a3a');r(5,8,2,2,'#fff');r(9,8,2,2,'#fff');r(6,9,1,1,'#111');r(10,9,1,1,'#111');r(7,11,2,1,'#fff');r(4,14,3,2,'#2a3a80');r(9,14,3,2,'#2a3a80')},
x:r=>{r(5,0,6,1,'#ffd700');r(4,1,1,1,'#ffd700');r(11,1,1,1,'#ffd700');r(5,2,6,2,'#2b1f5a');r(5,4,6,4,'#e8b98f');r(6,5,1,1,'#111');r(9,5,1,1,'#111');r(3,8,10,6,'#f8f3ff');r(3,8,10,1,'#ffd700');r(7,8,2,6,'#ffd700');r(2,9,1,4,'#e8b98f');r(13,9,1,4,'#e8b98f');r(5,14,2,2,'#e8b98f');r(9,14,2,2,'#e8b98f')}
};
function drawSpr(id,cx,cy){G.fillStyle='rgba(0,0,0,.25)';G.beginPath();G.ellipse(cx,cy,11,4,0,0,7);G.fill();const o=cx-16,y=cy-32;SP[id]((...a)=>R(o,y,...a))}
// ---- state ----
let st,T=0,FL=[];
function newSt(){const own=[],plot=[];for(let y=0;y<M;y++){own.push(Array(M).fill(false));plot.push(Array.from({length:M},()=>({c:null,gr:0,claim:false,last:'mango'})))}own[6][6]=own[6][7]=own[7][6]=own[7][7]=true;return{money:20,own,plot,work:[],sel:'mango',tab:'plant',sound:true,pl:{x:7,y:7,tg:null,m:false}}}
st=newSt();
try{const s=JSON.parse(localStorage.getItem('dhfarm_none')||'null');if(s){st.money=s.m;st.own=s.own;s.plot.forEach((r,y)=>r.forEach((p,x)=>{Object.assign(st.plot[y][x],{c:p[0],gr:p[1],last:p[2]})}));s.work.forEach(id=>st.work.push({id,p:WM[id].p,x:7.5,y:8.5,tg:null,w:0}));st.sel=s.sel}}catch(e){}
function save(){try{localStorage.setItem('dhfarm2',JSON.stringify({m:st.money,own:st.own,plot:st.plot.map(r=>r.map(p=>[p.c,p.gr,p.last])),work:st.work.map(w=>w.id),sel:st.sel}))}catch(e){}}
setInterval(()=>save(),5000);
// ---- audio ----
let AC;function aud(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type='square',v=.07,dl=0,sl=0){if(!AC||!st.sound)return;const t=AC.currentTime+dl,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(f*sl,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d)}
const SFX={coin:()=>{tone(988,.08);tone(1319,.16,'square',.07,.08)},plant:()=>tone(300,.14,'triangle',.15,0,1.8),buy:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.1,'square',.07,i*.07)),bad:()=>tone(150,.2,'sawtooth',.07),tap:()=>tone(600,.04)};
$('snd').onclick=()=>{aud();st.sound=!st.sound;$('snd').textContent=st.sound?'🔊':'🔇'};
// ---- helpers ----
const iso=(x,y)=>[OX+(x-y)*TW/2,OY+(x+y)*TH/2];
const ownCount=()=>st.own.flat().filter(Boolean).length;
const landCost=()=>8+5*(ownCount()-4);
const fl=(x,y,s,c)=>FL.push({x,y,t:0,s,c});
const ready=p=>p.c&&p.gr>=CROPS[p.c].t;
const adj=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>st.own[y+b]&&st.own[y+b][x+a]);
function plant(p,c,x,y){st.money-=seed(c);p.c=c;p.gr=0;p.last=c;SFX.plant();refresh()}
function act(x,y,wk){const p=st.plot[y][x];
 if(ready(p)){const v=YIELD*CROPS[p.c].p;st.money+=v;p.last=p.c;p.c=null;p.gr=0;fl(x+.5,y+.5,'+'+fmt(v)+'₱','#ffd84a');SFX.coin();if(wk&&st.money>=seed(p.last))plant(p,p.last,x,y);refresh()}
 else if(!p.c){if(st.money>=seed(st.sel))plant(p,st.sel,x,y);else if(!wk){fl(x+.5,y+.5,'돈 부족','#ff6b6b');SFX.bad()}}
 else if(!wk)fl(x+.5,y+.5,'자라는 중...','#fff')}
// ---- input ----
let dn=null;
C.addEventListener('pointerdown',e=>{aud();dn={x:e.clientX,y:e.clientY,ox:OX,oy:OY,mv:false};try{C.setPointerCapture(e.pointerId)}catch(_){}});
C.addEventListener('pointermove',e=>{if(!dn)return;const k=C.width/C.getBoundingClientRect().width,dx=(e.clientX-dn.x)*k,dy=(e.clientY-dn.y)*k;if(Math.hypot(dx,dy)>6)dn.mv=true;if(dn.mv){OX=Math.max(246-N*24,Math.min(N*24+154,dn.ox+dx));OY=Math.max(300-N*24,Math.min(60,dn.oy+dy))}});
C.addEventListener('pointerup',e=>{const d=dn;dn=null;if(d&&!d.mv)tapAt(e)});
function tapAt(e){const r=C.getBoundingClientRect(),px=(e.clientX-r.left)*C.width/r.width,py=(e.clientY-r.top)*C.height/r.height;
 const a=(px-OX)/(TW/2),b=(py-OY)/(TH/2),x=Math.floor((a+b)/2),y=Math.floor((b-a)/2);
 if(structTap(x,y))return;if(x<0||y<0||x>=N||y>=N)return;
 if(st.tab==='land'){if(st.own[y][x])return;if(!adj(x,y)){fl(x+.5,y+.5,'붙어있는 땅만!','#ff6b6b');SFX.bad();return}const c=landCost();if(st.money<c){fl(x+.5,y+.5,'돈 부족','#ff6b6b');SFX.bad();return}st.money-=c;st.own[y][x]=true;SFX.buy();fl(x+.5,y+.5,'땅 확장!','#7dff9a');refresh();return}
 if(!st.own[y][x]){fl(x+.5,y+.5,'내 땅이 아니에요','#ff6b6b');SFX.bad();return}
 SFX.tap();st.pl.tg={x,y}}
// ---- update ----
function step(o,tx,ty,sp,dt){const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);if(d<.08){return true}const m=Math.min(d,sp*dt);o.x+=dx/d*m;o.y+=dy/d*m;o.m=true;return false}
function update(dt){T+=dt;
 st.plot.forEach(r=>r.forEach(p=>{if(p.c&&p.gr<CROPS[p.c].t)p.gr+=dt*(B.rain>0?2:1)}));
 const P=st.pl;P.m=false;if(P.tg){if(step(P,P.tg.x+.5,P.tg.y+.5,3.5*Math.pow(1.5,st.tan||0),dt)){act(P.tg.x,P.tg.y,!!P.tg.au);P.tg=null}}
 st.work.forEach((w,wi)=>{w.m=false;if(w.w>0){w.w-=dt;return}if(B.gather>0){step(w,6.5+(wi%4)*.6,7.5+Math.floor(wi/4)*.6,3,dt);return}
  if(!w.tg){let best=null,bd=1e9;for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!st.own[y][x])continue;const p=st.plot[y][x];if(p.claim)continue;const rd=ready(p),em=!p.c&&!!pick(p.last);if(!(rd||em))continue;const d=Math.hypot(x+.5-w.x,y+.5-w.y)-(rd?5:0);if(d<bd){bd=d;best={x,y}}}if(best){st.plot[best.y][best.x].claim=true;w.tg=best}}
  if(w.tg){if(step(w,w.tg.x+.5,w.tg.y+.5,Math.min(2.6,.7+w.p/110)*SPM(),dt)){st.plot[w.tg.y][w.tg.x].claim=false;act(w.tg.x,w.tg.y,true);w.tg=null;w.w=.35}}});
 FL.forEach(f=>f.t+=dt);FL=FL.filter(f=>f.t<1.2)}
// ---- draw ----
function tile(x,y,top,l,r,h){const[cx,cy]=iso(x+.5,y+.5);
 G.fillStyle=l;G.beginPath();G.moveTo(cx-24,cy);G.lineTo(cx,cy+12);G.lineTo(cx,cy+12+h);G.lineTo(cx-24,cy+h);G.fill();
 G.fillStyle=r;G.beginPath();G.moveTo(cx+24,cy);G.lineTo(cx,cy+12);G.lineTo(cx,cy+12+h);G.lineTo(cx+24,cy+h);G.fill();
 G.fillStyle=top;G.beginPath();G.moveTo(cx,cy-12);G.lineTo(cx+24,cy);G.lineTo(cx,cy+12);G.lineTo(cx-24,cy);G.fill()}
function crop(c,p,cx,cy){const k=CROPS[c];
 if(p<.2){g.fillStyle='#5a3a1c';g.fillRect(cx-4,cy-3,8,4);g.fillStyle='#4fbf5f';g.fillRect(cx-1,cy-8,2,5);return}
 const h=Math.min(1,p),th=Math.round(6+h*16),cw=Math.round(8+h*14)&~1;
 g.fillStyle='#6b4423';g.fillRect(cx-2,cy-th,4,th);g.fillStyle='#2f9e4a';g.fillRect(cx-cw/2,cy-th-8,cw,8);g.fillStyle='#46c25f';g.fillRect(cx-cw/2+3,cy-th-12,cw-6,5);
 if(p>=1){g.fillStyle=k.c;const b=Math.round(Math.sin(T*6)*1.5);[[-cw/2+1,-th-2],[cw/2-6,-th-3],[-2,-th-9],[cw/2-10,-th+2]].forEach(([dx,dy])=>g.fillRect(Math.round(cx+dx),cy+dy+b,5,5))}}
const palm=(cx,cy)=>{g.fillStyle='#8a5a2a';g.fillRect(cx-2,cy-24,4,26);g.fillRect(cx,cy-30,3,8);g.fillStyle='#1f9a45';g.fillRect(cx-14,cy-34,14,4);g.fillRect(cx+2,cy-34,14,4);g.fillRect(cx-8,cy-40,16,4);g.fillStyle='#2fc060';g.fillRect(cx-12,cy-30,6,3);g.fillRect(cx+6,cy-30,6,3);g.fillStyle='#7a4a1a';g.fillRect(cx-3,cy-28,3,3);g.fillRect(cx+1,cy-28,3,3)};
const bush=(cx,cy)=>{g.fillStyle='#2b8f40';g.fillRect(cx-8,cy-8,16,8);g.fillStyle='#3fbf5a';g.fillRect(cx-5,cy-12,10,6)};
const flw=(cx,cy)=>{[['#ff5a7a',-6,-2],['#ffe14a',4,-4],['#fff',0,3],['#ff9a3c',-2,-6]].forEach(a=>{g.fillStyle=a[0];g.fillRect(cx+a[1],cy+a[2],3,3)})};
const rock=(cx,cy)=>{g.fillStyle='#8a8f96';g.fillRect(cx-6,cy-6,12,6);g.fillStyle='#aab0b8';g.fillRect(cx-4,cy-9,8,4)};
function draw(){
 const sk=g.createLinearGradient(0,0,0,150);sk.addColorStop(0,'#5bb8f0');sk.addColorStop(1,'#d9f4ff');g.fillStyle=sk;g.fillRect(0,0,400,360);
 g.fillStyle='rgba(255,229,102,.3)';g.beginPath();g.arc(330,45,32,0,7);g.fill();g.fillStyle='#ffe566';g.beginPath();g.arc(330,45,22,0,7);g.fill();
 g.fillStyle='#5a9a78';g.beginPath();g.moveTo(0,160);[[60,100],[120,150],[190,90],[260,155],[330,110],[400,160]].forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(400,200);g.lineTo(0,200);g.fill();
 g.fillStyle='#fff';for(let i=0;i<4;i++){const cx=((i*130+T*8)%520)-60,cy=30+i*22;g.fillRect(cx,cy,44,10);g.fillRect(cx+8,cy-6,26,8)}
 g.fillStyle='#2fb4d8';g.fillRect(0,190,400,170);g.fillStyle='#6fd6ee';for(let i=0;i<24;i++)g.fillRect((i*53+T*10)%420-10,195+(i*37)%160,16,2);
 g.fillStyle='#1d4fa8';g.fillRect(8,8,30,8);g.fillStyle='#cf2a3a';g.fillRect(8,16,30,8);g.fillStyle='#fff';g.beginPath();g.moveTo(8,8);g.lineTo(22,16);g.lineTo(8,24);g.fill();g.fillStyle='#ffd23c';g.fillRect(11,14,3,3);

function sideE(E){if(N!==14)return;E.push({d:20.5,f:()=>{const[cx,cy]=iso(14.5,6.5);portSpr(cx,cy+4)}});E.push({d:23.5,f:()=>{const[cx,cy]=iso(14.5,9.5);beachSpr(cx,cy+4)}});CU.forEach(u=>E.push({d:PS[u.s][0]+PS[u.s][1]+1,f:()=>{const[cx,cy]=iso(PS[u.s][0]+.5,PS[u.s][1]+.5);boat(cx,cy+2+Math.sin(T*2+u.s)*2,u)}}));if(TN.lie)E.push({d:40,f:()=>{const[cx,cy]=iso(st.pl.x,st.pl.y);g.font='22px serif';g.textAlign='center';g.fillText('☀️',cx+10,cy-44);g.fillStyle='rgba(0,0,0,.5)';g.fillRect(cx-20,cy-34,40,5);g.fillStyle='#ffb84a';g.fillRect(cx-20,cy-34,40*TN.t/8,5)}})}
function rainFx(){if(!(B.rain>0))return;g.save();g.fillStyle='rgba(20,40,90,.18)';g.fillRect(0,0,400,360);g.strokeStyle='rgba(190,220,255,.8)';g.lineWidth=1;g.beginPath();for(let i=0;i<60;i++){const x=(i*53+T*120)%420,y=(i*97+T*500)%380;g.moveTo(x,y);g.lineTo(x-4,y+12)}g.stroke();g.restore()}
// ===== 항구 로직 =====
function focus(x,y){const fx=x+.5,fy=y+.5;OX=Math.max(246-N*24,Math.min(N*24+154,200-(fx-fy)*24));OY=Math.max(300-N*24,Math.min(60,170-(fx+fy)*12))}
function openTab(t){SFX.tap();st.tab=t;tabsOn();panel();$('panel').scrollIntoView({behavior:'smooth',block:'nearest'})}
function sideTap(x,y){if(N!==14)return false;const u=CU.find(u=>PS[u.s][0]===x&&PS[u.s][1]===y);if(u){sell(u);return true}if(x===14&&y===6){openTab('port');return true}if(x===14&&y===9){openTab('tan');return true}return false}
function sell(u){const i=CU.indexOf(u);if(i<0)return;if(cnt(u.f)<u.q){SFX.bad();toast('창고에 '+CROPS[u.f].e+'가 부족해요 ('+cnt(u.f)+'/'+u.q+')');return}takeInv(u.f,u.q);CU.splice(i,1);st.money+=u.pay;SFX.coin();const nw=!st.cc[u.c];st.cc[u.c]=1;toast(COUN[u.c][0]+' '+COUN[u.c][1]+' 손님 +₱'+fmt(u.pay)+(nw?' · 🆕 컬렉션 등록!':''));refresh();if(st.tab==='coll')collPanel($('panel'));if(st.tab==='port')renderPortList()}
function portTick(dt){spT-=dt;if(spT<=0){spT=6+Math.random()*6;if(CU.length<3){const used=CU.map(u=>u.s),fr=[0,1,2].filter(s=>!used.includes(s)),s=fr[Math.floor(Math.random()*fr.length)],f=pickFruit(),q=100+Math.floor(Math.random()*101);let c=Math.floor(Math.random()*30);if(Math.random()<.6){const un=[...Array(30).keys()].filter(i=>!st.cc[i]);if(un.length)c=un[Math.floor(Math.random()*un.length)]}CU.push({c,f,q,s,t:50,pay:Math.round(q*CROPS[f].p*2*Math.max(1,sc()))});if(st.tab==='port')renderPortList()}}CU.forEach(u=>u.t-=dt);const n=CU.length;CU=CU.filter(u=>u.t>0);if(CU.length!==n&&st.tab==='port')renderPortList()}
function tanTick(dt){if(!TN.on)return;st.pl.tg=null;if(!TN.lie){if(step(st.pl,14.3,9.5,4,dt))TN.lie=true}else{TN.t+=dt;if(TN.t>=8){TN.on=false;TN.lie=false;st.tan++;SFX.buy();toast('☀️ 선탠 완료! '+TNN[st.tan]+' · 속도 ×'+Math.pow(1.5,st.tan).toFixed(2));if(st.tab==='tan')tanPanel($('panel'));if(st.tab==='coll')collPanel($('panel'));refresh()}}}
const _u3=update;update=function(dt){_u3(dt);portTick(dt);tanTick(dt);spoil()};
// ===== 패널 =====
function mini(fn){const cv=document.createElement('canvas');cv.width=cv.height=32;G=cv.getContext('2d');fn();G=g;return cv}
function staffPanel(P){P.innerHTML='<small>같은 직원은 최대 3명까지 · 새 캐릭터는 한 번만 · 비싼 직원일수록 빨라요</small><br><br>';[...W].sort((a,b)=>a.p-b.p).forEach(w=>{const d=document.createElement('div');d.className='item';const cv=mini(()=>SP[w.id]((...a)=>R(0,0,...a)));const s=document.createElement('span');s.textContent=w.n;const b=document.createElement('button');b.dataset.sw=w.id;b.onclick=()=>{aud();const n=st.work.filter(o=>o.id===w.id).length;if(n>=w.max||st.money<w.p)return;st.money-=w.p;st.work.push({id:w.id,p:w.p,x:7.5,y:8.5,tg:null,w:0});SFX.buy();refresh()};d.append(cv,s,b);P.appendChild(d)})}
function renderPortList(){const L=$('plist');if(!L)return;L.innerHTML='';$('pinfo').textContent='⚓ 거래한 나라 '+st.cc.filter(Boolean).length+'/30';if(!CU.length){L.innerHTML='<small>배가 오는 중이에요...</small>';return}CU.forEach(u=>{const d=document.createElement('div');d.className='item';const cv=document.createElement('canvas');cv.width=cv.height=32;face(cv.getContext('2d'),u.c,0,0,2);const s=document.createElement('span');s.innerHTML=COUN[u.c][0]+' <b>'+COUN[u.c][1]+'</b><br><small>'+CROPS[u.f].e+' '+CROPS[u.f].n+' ×'+u.q+' → ₱'+u.pay.toLocaleString()+' · 보유 '+cnt(u.f)+'</small>';const b=document.createElement('button');b.textContent='판매';b.onclick=()=>{aud();sell(u)};d.append(cv,s,b);L.appendChild(d)})}
function portPanel(P){focus(15,6);P.innerHTML='<div id="pinfo" style="font-weight:700;margin-bottom:6px"></div><small>손님을 탭하면 창고의 과일을 팔아요 (한 종류 100개 이상 · 시세의 2배). 판매에 성공해야 컬렉션에 등록돼요.</small><div id="plist" style="margin-top:8px"></div>';renderPortList()}
function tanPanel(P){focus(14,9);P.innerHTML='<div id="tinfo" style="font-weight:700;margin-bottom:6px"></div><small>선탠을 한 번 마칠 때마다 대환이 속도가 ×1.5씩 빨라져요. 선탠 중에는 일하지 않아요.</small><br><br><button id="tanbtn" style="width:100%;font-weight:700"></button><div id="tstages" style="margin-top:10px"></div>';$('tanbtn').onclick=()=>{aud();const nx=st.tan+1;if(TN.on||nx>4||st.money<TC[nx])return;st.money-=TC[nx];TN.on=true;TN.t=0;TN.lie=false;SFX.plant();refresh()};TNN.forEach((n,i)=>{const d=document.createElement('div');d.className='item';const cv=mini(()=>{TSK=i;SP.hero((...a)=>R(0,0,...a));TSK=null});if(i>st.tan)cv.style.filter='grayscale(1) brightness(.3)';const s=document.createElement('span');s.innerHTML='<b>'+(i>st.tan?'???':n)+'</b><br><small>'+(i?'₱'+TC[i].toLocaleString():'시작 상태')+'</small>';d.append(cv,s);$('tstages').appendChild(d)})}
function collPanel(P){P.innerHTML='';const sec=t=>{const h=document.createElement('h4');h.textContent=t;P.appendChild(h);const gd=document.createElement('div');gd.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:6px';P.appendChild(gd);return gd};
 const tile=(gd,el,txt,lock)=>{const d=document.createElement('div');d.className='item';d.style.cssText='flex-direction:column;margin:0;text-align:center;padding:6px 2px';if(lock)el.style.filter='grayscale(1) brightness(.3)';const s=document.createElement('span');s.style.cssText='font-size:11px;flex:none';s.textContent=txt;d.append(el,s);gd.appendChild(d)};
 const got=i=>st.cards[i]>0||st.cget[i];let n=0;CARDS.forEach((c,i)=>{if(got(i))n++});
 let gd=sec('🃏 카드 ('+n+'/'+CARDS.length+')');CARDS.forEach((c,i)=>{const im=document.createElement('img');im.src=IM[c[1]];im.style.cssText='width:100%;height:70px;object-fit:cover;border-radius:6px';tile(gd,im,got(i)?c[0]:'???',!got(i))});
 gd=sec('🌍 손님 ('+st.cc.filter(Boolean).length+'/30)');COUN.forEach((c,i)=>{const cv=document.createElement('canvas');cv.width=cv.height=32;face(cv.getContext('2d'),i,0,0,2);tile(gd,cv,st.cc[i]?c[0]+' '+c[1]:'???',!st.cc[i])});
 gd=sec('🏖️ 선탠 ('+(st.tan+1)+'/5)');TNN.forEach((nm,i)=>{const cv=mini(()=>{TSK=i;SP.hero((...a)=>R(0,0,...a));TSK=null});tile(gd,cv,i<=st.tan?nm:'???',i>st.tan)})}
st.inv=[];st.sq={};
const cnt=k=>st.inv.reduce((s,b)=>s+(b.k===k?b.n:0),0);
function addInv(k,n){st.inv.push({k,n,t:T})}
function takeInv(k,n){for(const b of st.inv){if(b.k!==k||n<=0)continue;const d=Math.min(b.n,n);b.n-=d;n-=d}st.inv=st.inv.filter(b=>b.n>0)}
function pickFruit(){const s=PRI.filter(k=>cnt(k)>=100),pool=(s.length&&Math.random()<.5)?s:PRI;return pool[Math.floor(Math.random()*pool.length)]}
function spoil(){let lost=0;st.inv=st.inv.filter(b=>{if(T-b.t<600)return true;lost+=b.n;return false});if(lost)toast('🗑️ 과일 '+lost+'개가 썩어서 사라졌어요')}
SP.hayang=r=>{r(3,5,8,1,'#fff');r(2,6,10,7,'#fff');r(2,11,10,2,'#e2e2e2');r(11,5,4,5,'#efe6da');r(10,5,1,2,'#cfc4b6');r(15,5,1,2,'#cfc4b6');r(13,6,1,1,'#111');r(14,8,1,1,'#f2a');r(3,13,2,3,'#555');r(9,13,2,3,'#555')};
SP.sero=r=>{r(1,8,1,4,'#111');r(2,7,10,6,'#f2f2f2');r(4,7,1,6,'#111');r(7,7,1,6,'#111');r(10,7,1,6,'#111');r(10,3,5,5,'#f2f2f2');r(13,6,3,3,'#ddd');r(10,2,2,5,'#111');r(10,1,1,2,'#111');r(12,1,1,2,'#111');r(13,4,1,1,'#111');r(3,13,2,3,'#222');r(9,13,2,3,'#222')};
function invPanel(P){P.innerHTML='<small>수확한 과일이 여기에 쌓여요. 10분이 지나면 썩어서 사라져요! 수량을 정해서 팔 수 있고, 1에서 −를 누르면 바로 최대가 돼요.</small><br><br>';Object.keys(CROPS).forEach(k=>{const c=CROPS[k],d=document.createElement('div');d.className='item';d.style.flexWrap='wrap';d.innerHTML='<span style="flex-basis:100%">'+c.e+' <b>'+c.n+'</b> <span data-wc="'+k+'"></span><br><small>개당 ₱'+c.p+' · <span data-wx="'+k+'"></span></small></span>';const mk=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.style.padding='8px 14px';b.onclick=()=>{aud();f();refresh()};return b};const q=document.createElement('b');q.dataset.wq=k;q.style.cssText='min-width:44px;text-align:center';const sb=document.createElement('button');sb.dataset.ws=k;sb.style.flex='1';sb.onclick=()=>{aud();const n=Math.min(st.sq[k]||1,cnt(k));if(n<1)return;takeInv(k,n);st.money+=n*c.p;SFX.coin();toast(c.e+' '+n+'개 판매 +₱'+fmt(n*c.p));refresh()};d.append(mk('−',()=>{const m=cnt(k);if(m<1)return;st.sq[k]=(st.sq[k]||1)<=1?m:st.sq[k]-1}),q,mk('+',()=>{const m=cnt(k);if(m<1)return;st.sq[k]=Math.min(m,(st.sq[k]||1)+1)}),sb);P.appendChild(d)})}
function invRefresh(){document.querySelectorAll('[data-wq]').forEach(e=>{const k=e.dataset.wq,m=cnt(k);st.sq[k]=m<1?1:Math.max(1,Math.min(st.sq[k]||1,m));e.textContent=m<1?'0':st.sq[k]});document.querySelectorAll('[data-wc]').forEach(e=>e.textContent='×'+cnt(e.dataset.wc));document.querySelectorAll('[data-wx]').forEach(e=>{const k=e.dataset.wx,o=st.inv.filter(b=>b.k===k).reduce((a,b)=>Math.min(a,b.t),1e9),r=Math.max(0,600-(T-o));e.textContent=o===1e9?'—':'부패까지 '+(r/60|0)+':'+String(r%60|0).padStart(2,'0')});document.querySelectorAll('[data-ws]').forEach(b=>{const k=b.dataset.ws,m=cnt(k),n=Math.min(st.sq[k]||1,m);b.disabled=m<1;b.textContent='판매 ₱'+fmt(n*CROPS[k].p)})}
const _p3=panel;panel=function(){const P=$('panel'),t=st.tab;if(t==='inv')invPanel(P);else if(t==='staff')staffPanel(P);else if(t==='port')portPanel(P);else if(t==='tan')tanPanel(P);else if(t==='coll')collPanel(P);else{_p3();return}refresh()};
const _rf3=refresh;refresh=function(){_rf3();document.querySelectorAll('[data-sw]').forEach(b=>{const w=WM[b.dataset.sw],n=st.work.filter(o=>o.id===w.id).length;b.disabled=n>=w.max||st.money<w.p;b.textContent=n>=w.max?(w.max===1?'보유 ✓':'최대 '+n+'/'+w.max):'고용 ₱'+w.p.toLocaleString()+(w.max>1?' ('+n+'/'+w.max+')':'')});const tb=$('tanbtn');if(tb){const nx=st.tan+1;tb.disabled=TN.on||nx>4||st.money<TC[nx];tb.textContent=nx>4?'최종 단계 달성!':(TN.on?'선탠 중...':'☀️ 선탠하기 ₱'+TC[nx].toLocaleString()+' → '+TNN[nx])}const ti=$('tinfo');if(ti)ti.textContent='현재: '+TNN[st.tan]+' · 대환 속도 ×'+Math.pow(1.5,st.tan).toFixed(2);invRefresh()};
// ===== 저장 =====
const _sv=save;save=function(){_sv();try{localStorage.setItem('dhfarm4x',JSON.stringify({cc:st.cc,tn:st.tan,cg:st.cget,iv:st.inv.map(b=>[b.k,b.n,Math.round(T-b.t)])}))}catch(e){}};
try{const x=JSON.parse(localStorage.getItem('dhfarm4x')||'null');if(x){st.cc=x.cc||st.cc;st.tan=x.tn||0;st.cget=x.cg||[];st.inv=(x.iv||[]).map(a=>({k:a[0],n:a[1],t:T-a[2]}))}}catch(e){}

const runCode=()=>{aud();const v=$('code').value.trim();$('code').value='';if(!v)return;if(v==='1234509876')coup();else{SFX.bad();toast('잘못된 코드예요')}};$('codeBtn').onclick=runCode;$('code').onkeydown=e=>{if(e.key==='Enter')runCode()};
load();tabsOn();panel();requestAnimationFrame(loop);
try{if(localStorage.getItem('dhfarm_started')!=='1'){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center';o.innerHTML='<div style="font-size:64px">🥭</div><h1 style="margin:0;font-size:26px">김대환의 필리핀 농장</h1><button id="startBtn" style="font-size:22px;font-weight:800;padding:14px 48px;background:var(--ac);color:#fff;border-color:var(--ac)">시작</button><small>시작을 누르면 모든 기록이 초기화돼요</small>';document.body.appendChild(o);$('startBtn').onclick=()=>{aud();save=function(){};try{['dhfarm4','dhfarm4x','dhfarm3','dhfarm3x','dhfarm2'].forEach(k=>localStorage.removeItem(k));localStorage.setItem('dhfarm_started','1')}catch(e){}let ok=false;try{ok=localStorage.getItem('dhfarm_started')==='1'}catch(e){}if(ok)location.reload();else o.remove()}}}catch(e){}
</script>
</body></html>
